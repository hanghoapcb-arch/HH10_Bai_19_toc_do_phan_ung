<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thí nghiệm 3D: Tốc độ trung bình của phản ứng phân huỷ H₂O₂</title>
<style>
:root{--bg:#0d1520;--p:#13202f;--p2:#1a2b40;--ln:#27405c;--tx:#e8eef6;--mu:#92a6bd;--ac:#35c2a1;--a2:#f0a04b;--bd:#ef6a6a;--ok:#4cd08a;--lw:246px;--rw:330px}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:14px "Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
button{font:inherit;font-size:13px;cursor:pointer}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
/* thanh trên */
#top{position:fixed;left:0;right:0;top:0;height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;background:rgba(10,18,28,.92);border-bottom:1px solid var(--ln);z-index:7;gap:8px}
#top .ttl{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;font-size:14px}
#top .grp{display:flex;gap:6px;align-items:center;flex-shrink:0}
#top input{background:#08111b;border:1px solid var(--ln);color:#fff;border-radius:8px;padding:4px 8px;width:140px;font-size:13px}
.sc{background:var(--p2);border:1px solid var(--ln);padding:2px 10px;border-radius:16px;white-space:nowrap;font-size:12.5px}.sc b{color:var(--ac)}
.tg{background:var(--p2);border:1px solid var(--ln);color:var(--mu);border-radius:8px;padding:4px 9px;font-size:12.5px;white-space:nowrap}
.tg.on{border-color:var(--ac);color:var(--ac)}.tg:hover{border-color:var(--ac)}
/* bảng hai bên */
.pn{position:fixed;background:rgba(19,32,47,.94);border:1px solid var(--ln);border-radius:12px;display:flex;flex-direction:column;min-height:0;z-index:5;transition:transform .25s,opacity .25s}
.ph{display:flex;justify-content:space-between;align-items:center;padding:5px 6px 5px 10px;border-bottom:1px solid var(--ln);font-weight:700;font-size:13px;gap:6px}
.ph button{padding:1px 8px}
#lp{left:10px;top:50px;width:226px;max-height:calc(100vh - 124px)}
#rp{right:10px;top:50px;width:310px;max-height:calc(100vh - 124px)}
#lp.hid{transform:translateX(-120%);opacity:0;pointer-events:none}#rp.hid{transform:translateX(120%);opacity:0;pointer-events:none}
.hdl{position:fixed;top:56px;z-index:6;display:none;background:rgba(19,32,47,.94);border:1px solid var(--ln);color:var(--ac);padding:8px 7px;font-size:15px}
#hl{left:0;border-radius:0 10px 10px 0;border-left:0}#hr{right:0;border-radius:10px 0 0 10px;border-right:0}
.body{overflow-y:auto;padding:7px 8px;min-height:0;flex:1}
.stp{border:1px solid var(--ln);border-radius:8px;background:#101d2c;padding:5px 8px;margin-bottom:5px;display:flex;gap:7px;align-items:center;cursor:pointer;font-size:12.8px;line-height:1.3}
.stp .si{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--mu);display:grid;place-items:center;font-size:11px;flex:none;color:var(--mu)}
.stp.done .si{background:var(--ok);border-color:var(--ok);color:#04231b}.stp.cur{border-color:var(--ac)}.stp.cur .si{border-color:var(--ac);color:var(--ac)}.stp.lock{opacity:.5}.stp.view{background:#16384a}
.tabs{display:flex;border-bottom:1px solid var(--ln)}.tabs button{flex:1;background:none;border:0;color:var(--mu);padding:6px 2px;border-bottom:2px solid transparent;font-size:12.5px}
.tabs button.on{color:var(--ac);border-bottom-color:var(--ac);font-weight:700}
/* thẻ thuyết minh */
#info{position:fixed;top:50px;left:calc(var(--lw) + (100vw - var(--lw) - var(--rw))/2);transform:translateX(-50%);width:min(540px,calc(100vw - var(--lw) - var(--rw) - 24px));min-width:240px;background:rgba(19,32,47,.94);border:1px solid var(--ln);border-radius:12px;z-index:5;font-size:12.8px;transition:left .25s,width .25s}
#info.hid{display:none}
#info .ih{display:flex;align-items:center;gap:6px;padding:4px 6px 4px 12px}
#info .ih b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#fff}
#info .ic{padding:1px 8px}
#info .ib{padding:7px 12px 9px;max-height:28vh;overflow-y:auto;line-height:1.55;color:#c9d6e5;border-top:1px solid var(--ln)}
#info.col .ib{display:none}
.eq{margin:5px 0;padding:5px 8px;background:#08111b;border-radius:6px;font-family:Cambria,"Times New Roman",serif;font-size:13.5px;color:#ffe3a8}
.tk{display:flex;gap:8px;align-items:center;padding:6px 8px;border:1px solid var(--ln);border-radius:8px;margin-bottom:5px;background:#101d2c;font-size:12.8px}
.tk i{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--mu);display:grid;place-items:center;font-style:normal;flex:none;font-size:11px}
.tk.ok{border-color:var(--ok)}.tk.ok i{background:var(--ok);border-color:var(--ok);color:#04231b}
.q{border:1px solid var(--ln);border-radius:10px;background:#101d2c;padding:8px;margin-bottom:8px}.q.okq{border-color:var(--ok)}.q.nq{border-color:var(--bd)}
.qh{font-size:11.5px;margin-bottom:3px;color:var(--ac);font-weight:700}.qt{line-height:1.45;margin-bottom:5px;font-size:13px}
.opt{display:block;width:100%;text-align:left;margin:3px 0;background:#0f1b2a;color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:5px 8px;line-height:1.35;font-size:12.8px}
.opt:hover:not(:disabled){border-color:var(--ac)}.opt.ok{border-color:var(--ok);background:#12362a}.opt.bad{border-color:var(--bd);background:#3a1a1a}
.ex{margin-top:5px;padding:5px 8px;border-radius:7px;font-size:12.3px;line-height:1.5}.ex.g{background:#12362a;color:#bdf0d3}.ex.r{background:#3a1c1c;color:#ffc9c9}
.tfi{border:1px solid var(--ln);border-radius:8px;padding:6px 8px;margin:5px 0;background:#0f1b2a}.tfi.ok{border-color:var(--ok)}.tfi.bad{border-color:var(--bd)}
.tft{line-height:1.4;margin-bottom:5px;font-size:12.8px}.tfb{display:flex;gap:6px}.tfb button{background:var(--p2);color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:3px 14px}
.tfb button.sel{background:var(--ac);color:#03241b;border-color:var(--ac);font-weight:700}.tfb button:disabled{cursor:default}
.tfc{margin-top:6px}.qh .ty{color:var(--mu);font-weight:400;margin-left:6px}
.btn{background:var(--p2);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:6px 11px}
.btn:hover:not(:disabled){border-color:var(--ac)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#03241b;font-weight:700}.btn.warn{border-color:var(--a2);color:var(--a2)}.btn.on{border-color:var(--ac);color:var(--ac)}
#ctrl{position:fixed;left:10px;right:10px;bottom:10px;min-height:46px;background:rgba(19,32,47,.94);border:1px solid var(--ln);border-radius:12px;padding:6px 10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;z-index:5}
#ctrl .sp{flex:1}
#eqb{position:fixed;left:50%;bottom:68px;transform:translateX(-50%);display:none;background:rgba(10,18,28,.94);border:1px solid var(--a2);border-radius:10px;padding:5px 14px;font-family:Cambria,"Times New Roman",serif;font-size:14px;color:#ffe3a8;z-index:5;text-align:center;line-height:1.55}
#toast{position:fixed;left:50%;top:100px;transform:translateX(-50%);background:#0a121c;border:1px solid var(--a2);color:#ffe3a8;padding:7px 14px;border-radius:20px;opacity:0;transition:opacity .3s;pointer-events:none;font-size:13px;z-index:9}
#nogl{position:fixed;left:20%;right:20%;top:45%;text-align:center;color:var(--a2);padding:12px;background:#0a121c;border:1px solid var(--ln);border-radius:10px;z-index:4}
.rs input{background:#08111b;border:1px solid var(--ln);color:#fff;border-radius:8px;padding:6px 9px;width:100%;margin:4px 0 8px}
.hi{border:1px solid var(--ln);border-radius:8px;padding:5px 8px;margin:5px 0;font-size:12.3px;background:#0f1b2a}
pre{white-space:pre-wrap;background:#08111b;padding:8px;border-radius:8px;font-size:12.3px;margin:6px 0}
@media(max-width:900px){#top input{width:100px}#top .ttl{display:none}#top{justify-content:flex-end}}
.sar{display:flex;gap:6px;margin:4px 0}.sai{flex:1;min-width:0;background:#08111b;border:1px solid var(--ln);color:#fff;border-radius:8px;padding:5px 8px;font-size:13px}.sl{font-size:12.5px;color:var(--mu);display:inline-flex;align-items:center;gap:6px}.sl b{color:var(--ac)}.sl input[type=range]{width:180px}</style></head>
<body>
<canvas id="cv"></canvas>
<div id="top"><div class="ttl">Thí nghiệm 3D: Tốc độ trung bình của phản ứng phân huỷ H₂O₂</div>
<div class="grp"><input id="stu" placeholder="Họ tên học sinh" maxlength="40">
<span class="sc" id="ckw" style="display:none">Đun: <b id="ck">0</b> phút</span><span class="sc" id="mc" style="display:none"></span><span class="sc">Điểm <b id="sc">0</b>/<span id="mx">13</span></span>
<button class="tg on" id="tgl" title="Ẩn/hiện bảng các bước">☰ Các bước</button><button class="tg on" id="tgi" title="Ẩn/hiện thuyết minh">ⓘ Thuyết minh</button><button class="tg on" id="tgr" title="Ẩn/hiện bảng học tập">📚 Học tập</button><button class="tg" id="tga" title="Ẩn hoặc khôi phục toàn bộ bảng">⛶ Toàn cảnh</button></div></div>
<div id="lp" class="pn"><div class="ph"><span>Các bước</span><button class="btn" id="tl" title="Ẩn bảng">✕</button></div><div class="body" id="stl"></div></div>
<div id="rp" class="pn"><div class="ph"><span>Học tập</span><button class="btn" id="tr" title="Ẩn bảng">✕</button></div>
<div class="tabs"><button data-t="tk" class="on">Nhiệm vụ</button><button data-t="qz">Câu hỏi</button><button data-t="rs">Kết quả</button></div>
<div class="body" id="rb"></div></div>
<div id="info"><div class="ih"><b id="it"></b><button class="btn ic" id="ic" title="Thu gọn / mở rộng">▾</button><button class="btn ic" id="ix" title="Ẩn thuyết minh">✕</button></div><div class="ib" id="ibd"></div></div>
<button class="hdl" id="hl" title="Hiện bảng các bước">☰</button><button class="hdl" id="hr" title="Hiện bảng học tập">📚</button>
<div id="eqb"></div>
<div id="ctrl"></div>
<div id="toast"></div><div id="nogl" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const rnd=(a,b)=>a+Math.random()*(b-a);
const fp=n=>String(Math.round(n*100)/100).replace('.',',');
const f3=n=>(Math.round(n*1000+1e-9)/1000).toFixed(3).replace('.',',');
const KEY='ddhoa-vtb-h2o2-v1',HKEY='ddhoa-vtb-h2o2-hist',UKEY='ddhoa-vtb-h2o2-ui';
let HAS3D=false,booted=false,tm=0,tab='tk',showL=true,FF=1;
const TV=[0,3,6,9,12],CV=[1,.707,.5,.354,.25];
const INTV=[[0,1],[1,2],[2,3],[3,4],[0,2],[0,4]];
const Cf=t=>Math.pow(2,-t/6);
const vt=(i,j)=>-(CV[j]-CV[i])/(TV[j]-TV[i]);
const ILB=INTV.map(p=>TV[p[0]]+' → '+TV[p[1]]+' h');
const TD='border:1px solid #4a5a6c;padding:2px 6px';
const STEPS=[
{k:'prep',t:'Chuẩn bị: phản ứng và số liệu',d:'<b>Phản ứng nghiên cứu (SGK, Bảng 19.1):</b><div class="eq">H₂O₂ → H₂O + ½O₂</div>H₂O₂ (hydrogen peroxide) tự phân huỷ chậm tạo nước và khí oxygen.<br><b>Mục đích:</b> hiểu cách xác định tốc độ trung bình của phản ứng từ sự biến thiên nồng độ theo thời gian; thấy tốc độ giảm dần khi nồng độ chất phản ứng giảm.<br><b>Số liệu:</b><table style="border-collapse:collapse;margin:4px 0;font-size:12px"><tr><td style="'+TD+'">t (h)</td><td style="'+TD+'">0</td><td style="'+TD+'">3</td><td style="'+TD+'">6</td><td style="'+TD+'">9</td><td style="'+TD+'">12</td></tr><tr><td style="'+TD+'">C(H₂O₂) mol/L</td><td style="'+TD+'">1,000</td><td style="'+TD+'">0,707</td><td style="'+TD+'">0,500</td><td style="'+TD+'">0,354</td><td style="'+TD+'">0,250</td></tr></table><div class="eq">v_tb = −ΔC/Δt = −(C₂ − C₁)/(t₂ − t₁)</div><i>Bình, bọt khí và đồ thị trong mô phỏng minh hoạ bảng số liệu: nồng độ vẽ theo đường cong C = 2^(−t/6) đi qua đúng 5 điểm của bảng (đường cong là phần tôi bổ sung). Bạn đối chiếu với sách.</i>'},
{k:'data',t:'Đo nồng độ H₂O₂ tại 5 thời điểm',d:'Bấm lần lượt <b>“Đo tại t = …”</b> cho 5 thời điểm 0, 3, 6, 9, 12 h: thời gian chạy tới mốc đó, màu dung dịch nhạt dần (nồng độ giảm) và điểm tương ứng hiện trên đồ thị. Có thể kéo thanh trượt để xem thời điểm bất kì.<br><b>Nhận xét từ bảng:</b> nồng độ giảm dần theo thời gian; sau mỗi 6 giờ nồng độ giảm một nửa (1,000 → 0,500 → 0,250).<br><i>Cách đo thực tế (chuẩn độ mẫu bằng KMnO₄ trong môi trường acid) là kiến thức bổ sung, không có trong ảnh sách; bạn đối chiếu xem sách có nêu không.</i>'},
{k:'calc',t:'Tính tốc độ trung bình trong 0 → 3 giờ',d:'<b>Theo sách:</b><br>Bước 1: biến thiên nồng độ trong 0 → 3 h: <b>ΔC = 0,707 − 1,000 = −0,293 mol/L</b> (dấu “−” cho biết nồng độ giảm).<br>Bước 2: <div class="eq">v_tb = −ΔC/Δt = −(0,707 − 1,000)/(3 − 0) = 0,293/3 ≈ 0,098 mol/(L·h)</div>Đặt dấu “−” trước biểu thức để tốc độ phản ứng có giá trị dương.<br>Bấm lần lượt “Bước 1” rồi “Bước 2”; đường thẳng nối hai điểm trên đồ thị (cát tuyến) hiện ra.'},
{k:'tab',t:'Tính cho các khoảng thời gian khác',d:'Bấm từng khoảng để tính v_tb và xem cát tuyến: 0 → 3, 3 → 6, 6 → 9, 9 → 12, 0 → 6, 0 → 12 h. Khi tính đủ 6 khoảng, bước hoàn thành.<br><b>Nhận xét:</b> v_tb giảm dần theo thời gian (0,098 → 0,069 → 0,049 → 0,035) vì nồng độ H₂O₂ giảm. Giá trị tính trên khoảng dài (0 → 12 h) chỉ là trung bình, không cho biết tốc độ tại một thời điểm cụ thể.'},
{k:'gr',t:'Đọc đồ thị: độ dốc và thời gian giảm một nửa',d:'Trên đồ thị nồng độ theo thời gian, đường cong đi xuống và thoải dần; độ dốc (tốc độ) lớn ở đầu rồi nhỏ dần. Trả lời hai câu bằng cách bấm đáp án:<br>• Khoảng nào có tốc độ trung bình lớn nhất?<br>• Sau bao lâu nồng độ giảm còn một nửa (0,500 mol/L)?<br><i>“Thời gian bán huỷ” và nhận xét tốc độ tỉ lệ nồng độ (phản ứng bậc 1, tỉ số khoảng 0,115 h⁻¹) là kiến thức bổ sung vượt chương trình phổ thông, không có trong ảnh.</i>'},
{k:'mol',t:'Mô hình phân tử: số phân tử H₂O₂ giảm dần',d:'Hộp có 40 phân tử H₂O₂ ở t = 0 (số phân tử vẽ tỉ lệ với nồng độ: 40 × C). Bấm “Chạy 0 → 12 h”: số phân tử H₂O₂ giảm dần, khí O₂ tạo ra, các va chạm thưa dần.<br><b>Giải thích:</b> nồng độ giảm nên số hạt trong một đơn vị thể tích ít đi, tốc độ phản ứng giảm.<br><i>Mô hình đơn giản hoá: chuyển động ngẫu nhiên, số va chạm hiển thị chỉ là ước lượng minh hoạ xu hướng giảm; không mô tả cơ chế thật của phản ứng.</i>'},
{k:'sa',t:'Bài tập trả lời ngắn (13 câu)',d:'Mở tab <b>Câu hỏi</b> bên phải: 13 câu trả lời ngắn dùng số liệu Bảng 19.1 (gõ số hoặc từ khoá). Mỗi câu được chấm hai lần thử; có nút <b>Gợi ý</b>; sau khi chấm có lời giải. Sai số làm tròn nhỏ vẫn được chấp nhận (ví dụ 0,0417 hoặc 0,042). Làm đúng ít nhất 10/13 câu để hoàn thành nhiệm vụ.<br><i>Câu 10, 11, 12 là phần vận dụng và mở rộng, không có trong ảnh: câu 10 coi nồng độ giảm theo quy luật gần đúng của bảng; câu 12 giả sử thể tích dung dịch không đổi và dùng 24,79 L/mol (25 °C, 1 bar); nếu dùng 22,4 L/mol (đktc) thì đáp án khoảng 0,66 L. Bạn chọn theo sách.</i>'},
{k:'sum',t:'Tổng kết',d:'<b>Kết luận:</b> tốc độ trung bình của phản ứng được tính bằng độ giảm nồng độ chất phản ứng trong một đơn vị thời gian: <b>v_tb = −ΔC/Δt</b>. Với phân huỷ H₂O₂, v_tb giảm dần theo thời gian vì nồng độ H₂O₂ giảm.<table style="border-collapse:collapse;margin:4px 0;font-size:12px"><tr><td style="'+TD+'">Khoảng (h)</td><td style="'+TD+'">ΔC</td><td style="'+TD+'">v_tb mol/(L·h)</td></tr><tr><td style="'+TD+'">0 → 3</td><td style="'+TD+'">−0,293</td><td style="'+TD+'">0,098</td></tr><tr><td style="'+TD+'">3 → 6</td><td style="'+TD+'">−0,207</td><td style="'+TD+'">0,069</td></tr><tr><td style="'+TD+'">6 → 9</td><td style="'+TD+'">−0,146</td><td style="'+TD+'">0,049</td></tr><tr><td style="'+TD+'">9 → 12</td><td style="'+TD+'">−0,104</td><td style="'+TD+'">0,035</td></tr><tr><td style="'+TD+'">0 → 6</td><td style="'+TD+'">−0,500</td><td style="'+TD+'">0,083</td></tr><tr><td style="'+TD+'">0 → 12</td><td style="'+TD+'">−0,750</td><td style="'+TD+'">0,063</td></tr></table><b>Lưu ý:</b> luôn kiểm tra đơn vị mol/(L·h); nếu viết 2H₂O₂ → 2H₂O + O₂ thì định nghĩa tốc độ có thể kèm hệ số chia (bài này SGK tính theo H₂O₂ với hệ số 1).'}
];
const STEPKEY=STEPS.map(s=>s.k);
const TASKS=[
 {k:'a',t:'Đo nồng độ H₂O₂ tại cả 5 thời điểm 0, 3, 6, 9, 12 h'},
 {k:'b',t:'Tính v_tb trong 0 → 3 h theo hai bước (ΔC rồi v_tb)'},
 {k:'c',t:'Tính v_tb cho đủ 6 khoảng thời gian'},
 {k:'d',t:'Chọn đúng khoảng có tốc độ trung bình lớn nhất'},

 MH.forEach((o,i)=>{o.m.visible=i<n;if(o.m.visible){mv(o);o.fl=Math.max(0,o.fl-dt);}});
 MO.forEach((o,i)=>{o.m.visible=i<no;if(o.m.visible)mv(o);});
 for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){const a=MH[i],b=MH[j];if(a.fl>0||b.fl>0)continue;const dx=a.x-b.x,dy=a.y-b.y,dz=a.z-b.z;if(dx*dx+dy*dy+dz*dz<1.2){a.fl=b.fl=.3;ev++;}}
 MH.forEach(o=>{if(o.m.visible)o.m.material.emissive.setHex(o.fl>0?0xffd34a:0x1a3d66);});
 const k=Math.min(1,dt*1.2);ST.cr=(ST.cr||0)*(1-k)+(ev/Math.max(dt,.001))*k;
 setLab(labs.MS,'t = '+f1(ST.rx)+' h   |   H₂O₂: '+n+'/40 phân tử (C ≈ '+f3(Cf(ST.rx))+' mol/L)   |   O₂: '+no,'#c8d6e5');
 setLab(labs.MC,'Va chạm giữa các phân tử H₂O₂ ≈ '+Math.round(ST.cr)+' lần/giây (ước lượng minh hoạ)','#ffe08a');
 setLab(labs.MK,'Xanh: H₂O₂   Đỏ: O₂   Chớp vàng: va chạm','#9ae6b4');}
function act(el){const a=el.dataset.act,v=+el.dataset.v;

 else if(a==='c1'){ST.calc1=1;ST.tsel=0;ST.eq=eqFor(0,1,false);renderCtrl();}
 else if(a==='c2'){if(ST.calc1<1)return;ST.calc1=2;ST.eq=eqFor(0,1,true);complete(2);}
 else if(a==='tk'){ST.tsel=v;ST.seen[v]=true;const p=INTV[v];ST.eq=eqFor(p[0],p[1],true);renderCtrl();if(INTV.every((_,k)=>ST.seen[k]))complete(3);}
 else if(a==='g1'||a==='g2'){const q=a==='g1'?0:1,ok=(q===0?v===0:v===1);if(ST.gdone[q])return;if(ok){ST.gdone[q]=true;ST.gans[q]=v;setTask(q===0?'d':'e');toast('✔ Chính xác.');if(q===0){ST.tt=1.5;ST.tsel=0;}if(ST.gdone[0]&&ST.gdone[1])complete(4);else renderCtrl();}else toast(q===0?'Chưa đúng: so sánh 0,098; 0,069; 0,049; 0,035.':'Chưa đúng: tìm thời điểm C = 0,500 mol/L trên đồ thị.');}
 else if(a==='play'){if(ST.rxDone){ST.rx=0;ST.rxDone=false;ST.rxPlay=true;}else ST.rxPlay=!ST.rxPlay;renderCtrl();}
 else if(a==='rxr'){ST.rx=0;ST.rxPlay=false;ST.rxDone=false;renderCtrl();}
 else if(a==='sa'){tab='qz';renderRight();if(!UI.r){UI.r=true;applyUI();}}
 else if(a==='fin')complete(7);
 else if(a==='lab'){showL=!showL;renderCtrl();}
 else if(a==='cam')setView();
 else if(a==='redo')resetExp();}
function renderLeft(){ $('stl').innerHTML=STEPS.map((s,i)=>{const lock=i>ST.step,cur=i===ST.step&&!ST.done[i];return`<div class="stp${ST.done[i]?' done':''}${cur?' cur':''}${lock?' lock':''}${ST.view===i?' view':''}" data-i="${i}"><span class="si">${ST.done[i]?'✓':i+1}</span><span>${s.t}</span></div>`;}).join(''); const v=ST.view;$('it').textContent='Bước '+(v+1)+': '+STEPS[v].t;$('ibd').innerHTML=STEPS[v].d;}

function renderCtrl(){const c=$('ctrl'),b=[],sk=STEPKEY[ST.view],i=ST.view,dn=ST.done[i];
 const B=(a,t,v,cls,dis)=>`<button class="btn${cls?' '+cls:''}" data-act="${a}" ${v!==undefined?'data-v="'+v+'"':''} ${dis?'disabled':''}>${t}</button>`;
 const sl=()=>b.push(`<span class="sl">t <input type="range" id="tsl" min="0" max="12" step="0.1" value="${ST.tt}"> <b id="trd">${f1(ST.tt)}</b> h</span>`);
 if(sk==='prep')b.push(B('start',dn?'✓ Đã xem':'Bắt đầu: xem số liệu','',dn?'':'pri'));
 else if(sk==='data'){sl();TV.forEach((t,k)=>b.push(B('meas','Đo tại t = '+t+' h',k,ST.meas[k]?'on':'')));}
 else if(sk==='calc'){sl();b.push(B('c1','Bước 1: tính ΔC (0 → 3 h)','',ST.calc1>=1?'on':'pri'));b.push(B('c2','Bước 2: tính v_tb','',ST.calc1>=2?'on':(ST.calc1===1?'pri':''),ST.calc1<1));}
 else if(sk==='tab'){INTV.forEach((p,k)=>b.push(B('tk',ILB[k],k,ST.seen[k]?(ST.tsel===k?'pri':'on'):'')));b.push(`<span class="sl">Đã tính: <b>${Object.keys(ST.seen).length}/6</b></span>`);}
 else if(sk==='gr'){sl();b.push('<span class="sl">Khoảng v_tb lớn nhất:</span>');G1.forEach((t,k)=>b.push(B('g1',t,k,ST.gdone[0]?(k===0?'on':''):'',ST.gdone[0])));b.push('<span class="sl">C giảm một nửa sau:</span>');G2.forEach((t,k)=>b.push(B('g2',t,k,ST.gdone[1]?(k===1?'on':''):'',ST.gdone[1])));}
 else if(sk==='mol'){b.push(B('play',ST.rxPlay?'⏸ Tạm dừng':(ST.rxDone?'↻ Chạy lại 0 → 12 h':'▶ Chạy 0 → 12 h'),'','pri'));b.push(B('rxr','⟲ Về t = 0'));b.push(`<span class="sl">t = <b>${f1(ST.rx)}</b> h</span>`);}
 else if(sk==='sa'){b.push(B('sa','Mở tab Câu hỏi (13 câu trả lời ngắn)','','pri'));b.push(`<span class="sl">Đã đúng: <b>${score()}/13</b></span>`);}
 else if(sk==='sum')b.push(B('fin',dn?'✓ Đã hoàn thành':'Hoàn thành tổng kết','',dn?'':'pri'));
 b.push('<span class="sp"></span>');b.push(B('lab','Nhãn',undefined,showL?'on':''));b.push(B('cam','Camera'));b.push(B('redo','Làm lại','', 'warn',busy()));
 c.innerHTML=b.join('');
 c.querySelectorAll('[data-act]').forEach(el=>{el.onclick=()=>{if(el.disabled)return;act(el);};});
 const s=$('tsl');if(s)s.oninput=e=>{ST.tt=+e.target.value;ST.tgt=null;ST.pend=-1;const r=$('trd');if(r)r.textContent=f1(ST.tt);};}
function qHTML(i){const q=QZ[i],a=QA[i],d=a.done;
 const cls=d?(a.ok?' okq':' nq'):'';
 let h=`<div class="q${cls}"><div class="qh">Câu ${i+1} · 1 đ<span class="ty">Trả lời ngắn${q.u?' · đơn vị: '+q.u:''}</span>${d?' · '+(a.ok?'1':'0')+' đ':''}</div><div class="qt">${q.q}</div>`;
 h+=`<div class="sar"><input class="sai" data-q="${i}" value="${String(a.val).replace(/"/g,'&quot;')}" placeholder="Nhập câu trả lời" ${d?'disabled':''}><button class="btn pri" data-sc="${i}" ${d?'disabled':''}>Chấm</button><button class="btn" data-sh="${i}" ${d?'disabled':''}>Gợi ý</button></div>`;
 if(a.hint&&!d)h+=`<div class="ex r" style="background:#3a2f12;color:#ffe3a8">Gợi ý: ${q.h}</div>`;
 if(!d&&a.tries===1)h+=`<div class="ex r">✘ Chưa đúng. Còn 1 lần thử.</div>`;
 if(d)h+=`<div class="ex ${a.ok?'g':'r'}">${a.ok?'✔ Chính xác. ':'✘ Hết lượt. Đáp án: <b>'+q.ans+'</b>. '}${q.x}</div>`;
 return h+'</div>';}
function checkSA(i){const a=QA[i],q=QZ[i];if(a.done)return;if(!String(a.val).trim()){toast('Hãy nhập câu trả lời trước.');return;}a.tries++;let ok=false;try{ok=!!q.chk(a.val);}catch(e){}if(ok){a.ok=true;a.done=true;}else if(a.tries>=2)a.done=true;save();
 if(score()>=10){setTask('g');if(ST.step>=6)complete(6);}renderRight();renderCtrl();}
function renderRight(){ document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));const rb=$('rb');
 if(tab==='tk'){rb.innerHTML=TASKS.map(t=>`<div class="tk${ST.tk[t.k]?' ok':''}"><i>${ST.tk[t.k]?'✓':''}</i><span>${t.t}</span></div>`).join('')+`<div class="hi">Nhiệm vụ tự đánh dấu khi bạn hoàn thành. Đã làm: <b>${Object.keys(ST.tk).length}/${TASKS.length}</b>.</div>`;}
 else if(tab==='qz'){const y=rb.scrollTop;rb.innerHTML=QZ.map((q,i)=>qHTML(i)).join('');rb.scrollTop=y;}
 else{const h=histGet();rb.innerHTML=`<div class="rs"><label>Họ tên học sinh</label><input id="stu2" value="${ST.stu.replace(/"/g,'&quot;')}" placeholder="Nhập họ tên"></div><pre id="rtx">${resText()}</pre><button class="btn pri" id="cp">Sao chép kết quả</button> <button class="btn" id="sv">Lưu vào lịch sử</button><div style="margin-top:10px;color:var(--mu)">Lịch sử trên trình duyệt này:</div>`+(h.length?h.slice().reverse().map(x=>`<div class="hi">${x}</div>`).join(''):'<div class="hi">Chưa có.</div>')+(h.length?'<button class="btn warn" id="hc" style="margin-top:6px">Xoá lịch sử</button>':'');
  const si=$('stu2');if(si)si.oninput=e=>{ST.stu=e.target.value;$('stu').value=ST.stu;save();$('rtx').textContent=resText();};
  const cp=$('cp');if(cp)cp.onclick=()=>{try{navigator.clipboard.writeText(resText());toast('Đã sao chép kết quả.');}catch(e){toast('Hãy chọn và sao chép thủ công.');}};
  const sv=$('sv');if(sv)sv.onclick=()=>{const h2=histGet();h2.push(new Date().toLocaleString('vi-VN')+' – '+(ST.stu||'(chưa nhập tên)')+': '+score()+'/'+QZ.length+' điểm, '+Object.keys(ST.tk).length+'/'+TASKS.length+' nhiệm vụ');try{localStorage.setItem(HKEY,JSON.stringify(h2));}catch(e){}renderRight();toast('Đã lưu lịch sử.');};
  const hc=$('hc');if(hc)hc.onclick=()=>{try{localStorage.removeItem(HKEY);}catch(e){}renderRight();};}
 $('sc').textContent=score();$('mx').textContent=QZ.length;}
function histGet(){try{return JSON.parse(localStorage.getItem(HKEY)||'[]');}catch(e){return[];}}

function init3D(){
 cvs=$('cv');R=new THREE.WebGLRenderer({canvas:cvs,antialias:true});R.setPixelRatio(Math.min(window.devicePixelRatio||1,2));

 cvs.addEventListener('pointerup',e=>pts.delete(e.pointerId));cvs.addEventListener('pointercancel',e=>pts.delete(e.pointerId));

  if(pts.size===1){const dx=e.clientX-p.x,dy=e.clientY-p.y;if(ST.mol){rotMol(dx,dy);}else{tg.th-=dx*.008;tg.ph=clamp(tg.ph-dy*.008,.25,1.55);}}
  else if(pts.size===2){const o=[...pts.entries()].find(([id])=>id!==e.pointerId)[1];const a0=Math.hypot(p.x-o.x,p.y-o.y),a1=Math.hypot(e.clientX-o.x,e.clientY-o.y);tg.r=clamp(tg.r*a0/Math.max(1,a1),6,45);}
  p.x=e.clientX;p.y=e.clientY;});
 cvs.addEventListener('wheel',e=>{e.preventDefault();tg.r=clamp(tg.r*(1+e.deltaY*.001),6,45);},{passive:false});

function frame(dt){

 if(ST.mol)updMol(dt);else updMacro(dt);

 const w=cvs.clientWidth,h=cvs.clientHeight;if(w&&h&&(cvs.width!==Math.floor(w*R.getPixelRatio())||cvs.height!==Math.floor(h*R.getPixelRatio()))){R.setSize(w,h,false);CAM.aspect=w/h;CAM.updateProjectionMatrix();}
 R.render(SC,CAM);}

 addEventListener('resize',applyUI);applyUI();}
